<svg xmlns="http://www.w3.org/2000/svg" width="460" height="165" viewBox="0 0 460 165" role="img" aria-label="Malakbadawyy GitHub stats: 439 contributions in the last year">
<style>
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    fill: #8b949e;
  }
  .title { font-size: 15px; font-weight: 600; fill: #db61a2; }
  .num { fill: #c9d1d9; font-weight: 600; }
  .big { font-size: 22px; font-weight: 700; fill: #c9d1d9; }
  .row, .ring, .center { opacity: 0; animation: fade .5s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  .arc {
    fill: none; stroke: #db61a2; stroke-width: 7; stroke-linecap: round;
    stroke-dasharray: 19 81;
    animation: grow 1s ease-out forwards;
  }
  @keyframes grow { from { stroke-dasharray: 0 100; } }
  @media (prefers-reduced-motion: reduce) {
    .row, .ring, .center { animation: none; opacity: 1; }
    .arc { animation: none; }
  }
</style>
<text class="title" x="20" y="28">GitHub Stats <tspan style="font-weight:400;font-size:11px" fill="#8b949e">· last 365 days · incl. private</tspan></text>
<g class="row" style="animation-delay:0.15s">
<rect x="20" y="47" width="9" height="9" rx="2" fill="#ff9ecf"/>
<text x="38" y="56">Total Contributions</text>
<text class="num" x="310" y="56" text-anchor="end">439</text>
</g>
<g class="row" style="animation-delay:0.25s">
<rect x="20" y="71" width="9" height="9" rx="2" fill="#db61a2"/>
<text x="38" y="80">Active Days</text>
<text class="num" x="310" y="80" text-anchor="end">71 / 365</text>
</g>
<g class="row" style="animation-delay:0.35s">
<rect x="20" y="95" width="9" height="9" rx="2" fill="#a92964"/>
<text x="38" y="104">Current Streak</text>
<text class="num" x="310" y="104" text-anchor="end">1 day</text>
</g>
<g class="row" style="animation-delay:0.45s">
<rect x="20" y="119" width="9" height="9" rx="2" fill="#701a45"/>
<text x="38" y="128">Longest Streak</text>
<text class="num" x="310" y="128" text-anchor="end">8 days</text>
</g>
<g class="row" style="animation-delay:0.55s">
<rect x="20" y="143" width="9" height="9" rx="2" fill="#a92964"/>
<text x="38" y="152">Busiest Day</text>
<text class="num" x="310" y="152" text-anchor="end">27 on Jan 26</text>
</g>
<g class="ring" style="animation-delay:.3s">
<circle cx="390" cy="88" r="44" fill="none" stroke="#8b949e" stroke-opacity="0.18" stroke-width="7"/>
<circle class="arc" cx="390" cy="88" r="44" pathLength="100" transform="rotate(-90 390 88)"/>
</g>
<g class="center" style="animation-delay:.6s">
<text class="big" x="390" y="90" text-anchor="middle">19%</text>
<text x="390" y="108" text-anchor="middle">days active</text>
</g>
</svg>